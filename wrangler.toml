# Template publico de deploy.
#
# Regras:
# - Este arquivo pode ir para o GitHub porque nao contem segredos nem IDs reais.
# - O Deploy Button/Workers Builds le este arquivo para descobrir bindings e provisionar D1.
# - Para deploy manual com valores reais, copie para wrangler.local.toml.
# - Nunca faca commit de wrangler.local.toml, database_id real, tokens ou secrets.

name = "lockbrief"
main = "src/index.ts"
compatibility_date = "2024-12-01"
keep_vars = true
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "lockbrief"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Namespaces publicos reservados pelo template LockBrief. Nao sao secrets nem IDs
# de recursos provisionados. Contadores sao locais a cada localidade Cloudflare.
[[ratelimits]]
name = "STORE_RATE_LIMITER"
namespace_id = "1246073101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "1246073102"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RESOURCE_RATE_LIMITER"
namespace_id = "1246073103"

  [ratelimits.simple]
  limit = 12
  period = 60

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "./dist"
