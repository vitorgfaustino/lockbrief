version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      cloudflare-toolchain:
        patterns:
          - "@cloudflare/*"
          - wrangler
        update-types:
          - minor
          - patch
      test-and-build-toolchain:
        patterns:
          - "@types/*"
          - esbuild
          - typescript
          - vitest
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
