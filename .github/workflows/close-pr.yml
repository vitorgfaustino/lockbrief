name: Close External PR

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'vitorgfaustino/lockbrief' &&
      github.event.pull_request.user.login != github.repository_owner &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const msg = `## Aviso

            Este repositório não aceita Pull Requests externos no momento.

            Se esta contribuição não for do mantenedor principal, o PR será fechado automaticamente.

            Para bugs, dúvidas ou sugestões, use a aba **Issues**.

            Obrigado pelo interesse no LockBrief.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
