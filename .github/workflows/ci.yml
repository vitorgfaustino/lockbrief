name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login == github.repository_owner ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            npm: "10.9.2"
          - node: "24"
            npm: "11.16.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm install --global npm@${{ matrix.npm }} --ignore-scripts
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: git diff --check
      - run: npm run typecheck
      - run: npm run build:client
      - run: npm test
      - run: npm run test:tooling
      - run: npm run test:sync
      - run: npm run check:distribution
        if: github.repository == 'vitorgfaustino/lockbrief'
      - run: npm run dev-init
      - run: npm run dev-init
      - run: npx --no-install wrangler deploy --dry-run --outdir /tmp/lockbrief-dry-run --config wrangler.toml
